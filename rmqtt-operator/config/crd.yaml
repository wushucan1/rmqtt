apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rmqttclusters.rmqtt.io
spec:
  group: rmqtt.io
  scope: Namespaced
  names:
    plural: rmqttclusters
    singular: rmqttcluster
    kind: RmqttCluster
    shortNames:
      - rmq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                image:
                  type: string
                  default: rmqtt-dynamic-test:official-amd64-20260713-155254
                service:
                  type: object
                  properties:
                    mqttPort:
                      type: integer
                      default: 1883
                    httpApiPort:
                      type: integer
                      default: 6060
                    grpcPort:
                      type: integer
                      default: 5363
                    raftPort:
                      type: integer
                      default: 6003
                raft:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      minimum: 1
                      default: 3
                    drainTimeoutSeconds:
                      type: integer
                      minimum: 1
                      default: 300
                    allowLeaderScaleIn:
                      type: boolean
                      default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Operation
          type: string
          jsonPath: .status.operation.phase
        - name: Leader
          type: integer
          jsonPath: .status.leaderId
